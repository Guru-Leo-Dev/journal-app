<!doctype html>
<html lang="en" data-theme="sunset">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparse Musings</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // apply the saved theme before first paint (no colour flash)
    try { var t = localStorage.getItem('sm-theme'); if (t === 'sunset' || t === 'meadow') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Shrikhand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Retro flower (colours follow the active theme) -->
      <symbol id="flower" viewBox="-100 -100 200 200">
        <g class="pf1">
          <ellipse cy="-58" rx="30" ry="42"/>
          <ellipse cy="-58" rx="30" ry="42" transform="rotate(45)"/>
          <ellipse cy="-58" rx="30" ry="42" transform="rotate(90)"/>
          <ellipse cy="-58" rx="30" ry="42" transform="rotate(135)"/>
          <ellipse cy="-58" rx="30" ry="42" transform="rotate(180)"/>
          <ellipse cy="-58" rx="30" ry="42" transform="rotate(225)"/>
          <ellipse cy="-58" rx="30" ry="42" transform="rotate(270)"/>
          <ellipse cy="-58" rx="30" ry="42" transform="rotate(315)"/>
        </g>
        <g class="pf2">
          <ellipse cy="-50" rx="21" ry="32"/>
          <ellipse cy="-50" rx="21" ry="32" transform="rotate(45)"/>
          <ellipse cy="-50" rx="21" ry="32" transform="rotate(90)"/>
          <ellipse cy="-50" rx="21" ry="32" transform="rotate(135)"/>
          <ellipse cy="-50" rx="21" ry="32" transform="rotate(180)"/>
          <ellipse cy="-50" rx="21" ry="32" transform="rotate(225)"/>
          <ellipse cy="-50" rx="21" ry="32" transform="rotate(270)"/>
          <ellipse cy="-50" rx="21" ry="32" transform="rotate(315)"/>
        </g>
        <g class="pf3">
          <ellipse cy="-40" rx="12" ry="22"/>
          <ellipse cy="-40" rx="12" ry="22" transform="rotate(45)"/>
          <ellipse cy="-40" rx="12" ry="22" transform="rotate(90)"/>
          <ellipse cy="-40" rx="12" ry="22" transform="rotate(135)"/>
          <ellipse cy="-40" rx="12" ry="22" transform="rotate(180)"/>
          <ellipse cy="-40" rx="12" ry="22" transform="rotate(225)"/>
          <ellipse cy="-40" rx="12" ry="22" transform="rotate(270)"/>
          <ellipse cy="-40" rx="12" ry="22" transform="rotate(315)"/>
        </g>
        <circle class="pf4" r="20"/>
      </symbol>

      <!-- Mood faces: 5 joyful (green) ... 1 angry (red) -->
      <symbol id="face-5" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#34B35A" stroke="#202A2B" stroke-width="5"/>
        <path d="M24 44 Q33 31 42 44 M58 44 Q67 31 76 44" fill="none" stroke="#202A2B" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M24 57 Q50 92 76 57 Z" fill="#202A2B" stroke="#202A2B" stroke-width="4" stroke-linejoin="round"/>
        <path d="M37 73 Q50 65 63 73 Q50 84 37 73 Z" fill="#FF8A80"/>
      </symbol>
      <symbol id="face-4" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#9ACD32" stroke="#202A2B" stroke-width="5"/>
        <circle cx="34" cy="42" r="5.5" fill="#202A2B"/><circle cx="66" cy="42" r="5.5" fill="#202A2B"/>
        <path d="M29 60 Q50 82 71 60" fill="none" stroke="#202A2B" stroke-width="5.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="face-3" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#FFC21A" stroke="#202A2B" stroke-width="5"/>
        <circle cx="34" cy="42" r="5.5" fill="#202A2B"/><circle cx="66" cy="42" r="5.5" fill="#202A2B"/>
        <path d="M34 67 H66" fill="none" stroke="#202A2B" stroke-width="5.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="face-2" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#F7882F" stroke="#202A2B" stroke-width="5"/>
        <circle cx="34" cy="44" r="5.5" fill="#202A2B"/><circle cx="66" cy="44" r="5.5" fill="#202A2B"/>
        <path d="M32 74 Q50 56 68 74" fill="none" stroke="#202A2B" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M72 52 Q64 62 72 68 Q80 62 72 52 Z" fill="#7FD6FF" stroke="#202A2B" stroke-width="2.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="face-1" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#E53935" stroke="#202A2B" stroke-width="5"/>
        <path d="M22 30 L44 42 M78 30 L56 42" fill="none" stroke="#202A2B" stroke-width="6.5" stroke-linecap="round"/>
        <circle cx="36" cy="52" r="5.5" fill="#202A2B"/><circle cx="64" cy="52" r="5.5" fill="#202A2B"/>
        <path d="M31 76 Q50 58 69 76" fill="none" stroke="#202A2B" stroke-width="5.5" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- The book. Pages are drawn into #book by app.js -->
  <main class="stage" id="stage">
    <div class="book" id="book" aria-live="polite"></div>
  </main>

  <button class="nav nav-prev" id="prevBtn" type="button" aria-label="Previous page" title="Previous page">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="nav nav-next" id="nextBtn" type="button" aria-label="Next page" title="Next page">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <button class="add-btn" id="addBtn" type="button" aria-label="Add a new page" title="Add a new page">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="3.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
  </button>

  <!-- Theme switcher -->
  <div class="theme-wrap">
    <button class="theme-btn" id="themeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Change theme" title="Change theme">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 100 17c1.3 0 2-.8 2-1.8 0-1.4-1.2-1.7-1.2-2.8 0-.9.7-1.5 1.7-1.5H17a3.5 3.5 0 003.5-3.5C20.5 6.7 16.7 3.5 12 3.5z"/><circle cx="7.8" cy="11" r="1" fill="#202A2B"/><circle cx="10.6" cy="7.4" r="1" fill="#202A2B"/><circle cx="15.2" cy="7.8" r="1" fill="#202A2B"/></svg>
    </button>
    <div class="theme-menu" id="themeMenu" hidden>
      <div class="theme-title">Theme</div>
      <button type="button" class="theme-opt" data-theme-opt="sunset" aria-pressed="false">
        <span class="swatch"><i style="background:#E5532D"></i><i style="background:#FFAE00"></i><i style="background:#F9A961"></i><i style="background:#969200"></i></span>
        <span>Sunset <small>orange</small></span>
      </button>
      <button type="button" class="theme-opt" data-theme-opt="meadow" aria-pressed="false">
        <span class="swatch"><i style="background:#2F9E57"></i><i style="background:#BDE55C"></i><i style="background:#7FD494"></i><i style="background:#E1750B"></i></span>
        <span>Meadow <small>green</small></span>
      </button>
    </div>
  </div>

  <!-- Profile / account -->
  <div class="profile-wrap" id="profileWrap" hidden>
    <button class="theme-btn profile-btn" id="profileBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Account" title="Account">
      <img id="profileImg" alt="" referrerpolicy="no-referrer" hidden>
      <span id="profileInitial"></span>
    </button>
    <div class="theme-menu profile-menu" id="profileMenu" hidden>
      <div class="profile-name" id="profileName"></div>
      <div class="profile-email" id="profileEmail"></div>
      <button type="button" class="theme-opt" id="changePwBtn" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 118 0v2.5"/></svg>
        <span>Change password</span>
      </button>
      <button type="button" class="theme-opt" id="signOutBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5.5A1.5 1.5 0 004 5.5v13A1.5 1.5 0 005.5 20H9M16 8l4 4-4 4M20 12H9"/></svg>
        <span>Sign out</span>
      </button>
    </div>
  </div>

  <!-- Sign in -->
  <div class="login" id="login" hidden>
    <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <svg class="login-flower" aria-hidden="true"><use href="#flower"/></svg>
      <h1 class="login-title" id="loginTitle">Sparse Musings</h1>
      <p class="login-sub">your own little journal, one page a day</p>
      <form class="login-form" id="localForm" novalidate hidden autocomplete="off">
        <div class="login-tabs" id="loginTabs" role="group" aria-label="Sign in or create an account">
          <button type="button" data-tab="login" aria-pressed="true">Sign in</button>
          <button type="button" data-tab="register" aria-pressed="false">Create account</button>
        </div>
        <input class="login-input" id="lgName" type="text" maxlength="50" autocomplete="off" placeholder="Your name" hidden>
        <input class="login-input" id="lgUser" type="text" maxlength="30" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Username">
        <div class="pass-wrap">
          <input class="login-input" id="lgPass" type="password" maxlength="128" autocomplete="new-password" placeholder="Password">
          <button type="button" class="pass-eye" id="passEye" aria-label="Show password" aria-pressed="false" title="Show password">
            <svg class="eye-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-shut" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18M10.6 5.2A10.5 10.5 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 004.2 4.2"/></svg>
          </button>
        </div>
        <button type="submit" class="btn primary login-submit" id="lgSubmit">Sign in</button>
      </form>
      <div class="login-or" id="loginOr" hidden><span>or</span></div>
      <button type="button" class="google-btn" id="googleBtn" hidden>
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Continue with Google</span>
      </button>
      <p class="login-err" id="loginError" role="alert" hidden></p>
      <p class="login-fine">Everyone gets their own private journal.</p>
    </div>
  </div>

  <!-- Change password / PIN -->
  <div class="modal" id="pwModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <form class="sheet pw-sheet" id="pwForm" novalidate autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
      <h3 class="sheet-title" id="pwTitle">Change password</h3>
      <div class="field"><label for="pwCurrent">Current password</label>
        <input class="login-input" id="pwCurrent" type="password" maxlength="128" autocomplete="off"></div>
      <div class="field"><label for="pwNew">New password or PIN <small>(4 or more characters)</small></label>
        <input class="login-input" id="pwNew" type="password" maxlength="128" autocomplete="new-password"></div>
      <div class="field"><label for="pwNew2">New password again</label>
        <input class="login-input" id="pwNew2" type="password" maxlength="128" autocomplete="new-password"></div>
      <label class="pw-show"><input type="checkbox" id="pwShow"> Show passwords</label>
      <p class="error" id="pwError" role="alert" hidden></p>
      <div class="actions">
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="pwSave">Save</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <!-- Add / edit a day -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <form class="sheet" id="entryForm" novalidate role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h3 class="sheet-title" id="sheetTitle">New Page</h3>

      <div class="field">
        <span class="field-label">Date</span>
        <button type="button" class="date-btn" id="dateBtn" aria-expanded="false" aria-controls="cal">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span id="dateLabel"></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#202A2B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="cal" id="cal" hidden></div>
      </div>

      <div class="field">
        <span class="field-label">How are you feeling?</span>
        <div class="moods" id="moods" role="group" aria-label="Mood"></div>
      </div>

      <div class="field">
        <label for="titleInput">Title</label>
        <input id="titleInput" type="text" maxlength="50" autocomplete="off" placeholder="What was today about?">
      </div>

      <div class="field">
        <label for="bodyInput">Dear journal&hellip;</label>
        <textarea id="bodyInput" rows="5" maxlength="5000" placeholder="Write your heart out&hellip;"></textarea>
        <div class="counter" id="counter">0 / 5000</div>
      </div>

      <p class="note" id="note" hidden></p>
      <p class="error" id="formError" role="alert" hidden></p>

      <div class="actions">
        <button type="button" class="link-danger" id="deleteBtn" hidden>Delete page</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save page</button>
      </div>
    </form>
  </div>

  <!-- Edit the prologue -->
  <div class="modal" id="prologueModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <form class="sheet" id="prologueForm" novalidate role="dialog" aria-modal="true" aria-labelledby="prologueSheetTitle">
      <h3 class="sheet-title" id="prologueSheetTitle">Prologue</h3>

      <div class="field">
        <label for="proIntro">About me</label>
        <textarea id="proIntro" rows="5" maxlength="450" placeholder="Who are you, and why this journal?"></textarea>
        <div class="counter" id="proIntroCount">0 / 450</div>
      </div>
      <div class="field">
        <label for="proQuote">A quote I live by</label>
        <input id="proQuote" type="text" maxlength="140" autocomplete="off" placeholder="Something that keeps you going">
      </div>
      <div class="field">
        <label for="proLoves">Things I love</label>
        <textarea id="proLoves" rows="4" maxlength="300" placeholder="Rainy days&#10;Filter coffee&#10;Long walks"></textarea>
        <div class="hint">One per line, up to 6.</div>
      </div>
      <div class="field">
        <label for="proGoals">Dreams &amp; goals</label>
        <textarea id="proGoals" rows="4" maxlength="300" placeholder="Write every day&#10;Learn the guitar"></textarea>
        <div class="hint">One per line, up to 6.</div>
      </div>

      <p class="error" id="proError" role="alert" hidden></p>
      <div class="actions">
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="proSave">Save prologue</button>
      </div>
    </form>
  </div>

  <!-- Off-screen ruler used to split long entries across pages -->
  <div class="body-text measure" id="measure" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
